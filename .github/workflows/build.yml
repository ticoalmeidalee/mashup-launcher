name: build

on:
  push:
    branches: [main, "build/**", "fix/**"]
    tags: ["v*"]
  pull_request:

# read-only by default: only the release job below can write (publish a release), and only for tags
permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Find the C# compiler (Roslyn from Visual Studio)
        shell: pwsh
        run: |
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          "CSC=$vs\MSBuild\Current\Bin\Roslyn\csc.exe" | Out-File -Append $env:GITHUB_ENV

      - name: Launcher build and self-tests
        shell: cmd
        run: test.bat

      - name: Cache the plugin's build dependencies (dev-c.com is sometimes unreachable)
        uses: actions/cache@v4
        with:
          path: mashups/gta-minecraft/gta/third_party
          key: gta-third-party-v1

      - name: GTA plugin (ScriptHookV + ReShade add-on)
        shell: pwsh
        run: |
          ./mashups/gta-minecraft/gta/fetch_deps.ps1
          cmd /c mashups\gta-minecraft\gta\build.bat
          if (-not (Test-Path mashups/gta-minecraft/gta/build/MCPassthrough.asi)) { throw "plugin build failed" }

      - name: Minecraft mod (Fabric)
        shell: bash
        working-directory: mashups/gta-minecraft/mc
        run: ./gradlew build --no-daemon

      - name: Packages
        shell: pwsh
        run: |
          ./mashups/gta-minecraft/package.ps1
          ./tools/package-launcher.ps1 -Version "${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}"

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            dist/*.zip
            dist/*.sha256

  release:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        # a tag with a suffix (v1.1.0-rc1) is a pre-release: never shown as the latest
        run: |
          pre=""; case "${{ github.ref_name }}" in *-*) pre="--prerelease";; esac
          gh release create "${{ github.ref_name }}" dist/*.zip dist/*.sha256 --repo "${{ github.repository }}" --title "${{ github.ref_name }}" --generate-notes $pre
